<script>
/* ═══════════════════════════════════════════════════════════════════════
   IDIOMA DO PERFIL — chips do padrão da landing (living-resume-card.tsx):
   ativo = preenchido em ink; inativo = surface com hairline.
   ═══════════════════════════════════════════════════════════════════ */
const LANGS = [
  { key: 'en',    label: 'English'   },
  { key: 'pt-BR', label: 'Português' },
];
let activeLang = 'pt-BR';

function renderLangs() {
  document.getElementById('langPills').innerHTML = LANGS.map(l => {
    const on = l.key === activeLang;
    return `<button data-lang="${l.key}"
      class="rounded-full border px-4 py-[7px] text-[13px] font-medium transition ${
        on ? 'border-ink bg-ink text-paper' : 'border-hair bg-surface text-ink hover:border-hairs'
      }">${l.label}</button>`;
  }).join('');
  document.querySelectorAll('[data-lang]').forEach(b => {
    b.addEventListener('click', () => { activeLang = b.dataset.lang; renderLangs(); });
  });
}
renderLangs();


/* ═══════════════════════════════════════════════════════════════════════
   URL — só leitura. A ação é copiar, não editar.
   ═══════════════════════════════════════════════════════════════════ */
const copyBtn  = document.getElementById('copyUrl');
const copyIcon = document.getElementById('copyIcon');
const copyFlag = document.getElementById('copyFlag');
const CHECK = '<path d="M20 6 9 17l-5-5"/>';
const COPY  = '<rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>';
let copyTimer;

copyBtn.addEventListener('click', async () => {
  const url = document.getElementById('urlText').textContent.trim();
  try { await navigator.clipboard.writeText('https://' + url); } catch { /* demo */ }
  copyIcon.innerHTML = CHECK;
  copyIcon.setAttribute('stroke', '#5766E8');
  copyFlag.classList.remove('hidden');
  clearTimeout(copyTimer);
  copyTimer = setTimeout(() => {
    copyIcon.innerHTML = COPY;
    copyIcon.setAttribute('stroke', '#71717A');
    copyFlag.classList.add('hidden');
  }, 1600);
});


/* ═══════════════════════════════════════════════════════════════════════
   DADOS — perfil real da Maria
   (GET /v1/users/profile + /v1/resumes/:id/sections)
   ═══════════════════════════════════════════════════════════════════ */
const IDENTITY = [
  { label: 'Nome',        value: 'Maria Oliveira de Souza' },
  { label: 'Título',      value: 'Engenheira de Software Plena' },
  { label: 'Localização', value: 'São Paulo, Brazil' },
  { label: 'Resumo',      value: null },
  { label: 'Telefone',    value: null },
];

const EXPERIENCE = [
  { role: 'Engenheira de Software Plena', company: 'Patch Tech',       dates: 'Mar 2022 — Jun 2024',
    description: 'Liderei a migração do app para Expo + React Native Web.',
    achievements: ['Reduzi o tempo de build em 40%', 'Migrei 30 telas para a nova stack'] },
  { role: 'Desenvolvedora Júnior',        company: 'Loja Online BR',   dates: 'Jan 2020 — Fev 2022',
    description: 'Desenvolvi o checkout e a integração de pagamentos.',
    achievements: ['Integrei 3 gateways de pagamento'] },
  { role: 'Estagiária de Desenvolvimento', company: 'Startup Educação', dates: 'Jun 2019 — Dez 2019',
    description: 'Apoiei o time de frontend em features de gamificação.',
    achievements: ['Implementei o sistema de pontos'] },
];

const EDUCATION = [
  { institution: 'Universidade de São Paulo', degree: 'Bacharelado em Ciência da Computação', meta: 'Concluído', dates: 'Fev 2016 — Dez 2019' },
  { institution: 'FIAP',                      degree: 'Mestrado em Engenharia de Software',   meta: 'Concluído', dates: 'Fev 2020 — Jun 2021' },
];

const PEN = `<svg class="pen" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>`;

const head = title => `
  <div class="mb-10 flex">
    <h2 class="font-sans text-[22px] font-semibold leading-none tracking-[-.4px] text-ink">${title}</h2>
  </div>`;

/* O que a seção ainda não tem: uma lista de travessões no fim dela, em vez
   de um "Adicionar" pendurado em cada campo vazio. */
const gaps = labels => labels.length === 0 ? '' : `
  <div class="mt-8">
    <p class="smallcaps text-subtle">Falta</p>
    <ul class="mt-4 space-y-[7px]">
      ${labels.map(l => `
        <li class="flex gap-2 text-[13px] leading-[19px] text-muted">
          <span class="text-subtle">—</span><span>${l}</span>
        </li>`).join('')}
    </ul>
  </div>`;

/* A porta de entrada da seção fica depois do último item, não no cabeçalho. */
const add = label => `
  <button class="mt-9 flex w-full items-center justify-center gap-2 rounded-xl border border-hair bg-surface py-[14px] text-[13.5px] font-medium text-body transition hover:border-hairs hover:bg-paper hover:text-ink">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
    ${label}
  </button>`;

document.getElementById('sections').innerHTML = `
  <section class="rounded-[20px] border border-hair bg-panel px-9 py-8">
    ${head('Identidade')}
    <dl>
      ${IDENTITY.filter(f => f.value).map(f => `
        <div class="row flex cursor-pointer items-baseline gap-5 border-b border-hair py-4 last:border-b-0">
          <dt class="w-[104px] shrink-0 text-[12.5px] text-muted">${f.label}</dt>
          <dd class="flex-1 text-[14.5px] text-ink">${f.value}</dd>
          ${PEN}
        </div>`).join('')}
    </dl>
    ${gaps(IDENTITY.filter(f => !f.value).map(f => f.label))}
    ${add('Adicionar campo')}
  </section>

  <section class="rounded-[20px] border border-hair bg-panel px-9 py-8">
    ${head('Experiência Profissional')}
    <div>
      ${EXPERIENCE.map(e => `
        <article class="row cursor-pointer border-b border-hair py-7 first:pt-0 last:border-b-0 last:pb-0">
          <div class="flex items-baseline gap-4">
            <h3 class="flex-1 text-[15px] font-semibold text-ink">${e.role}</h3>
            <span class="shrink-0 font-mono text-[11px] text-muted">${e.dates}</span>
            ${PEN}
          </div>
          <p class="mt-1.5 text-[13.5px] text-body">${e.company}</p>
          <p class="mt-4 text-[13.5px] leading-[20px] text-body">${e.description}</p>
          <ul class="mt-4 space-y-[7px]">
            ${e.achievements.map(a => `
              <li class="flex gap-2 text-[13px] leading-[19px] text-muted">
                <span class="text-subtle">—</span><span>${a}</span>
              </li>`).join('')}
          </ul>
        </article>`).join('')}
    </div>
    ${add('Adicionar experiência')}
  </section>

  <section class="rounded-[20px] border border-hair bg-panel px-9 py-8">
    ${head('Formação Acadêmica')}
    <div>
      ${EDUCATION.map(e => `
        <article class="row cursor-pointer border-b border-hair py-7 first:pt-0 last:border-b-0 last:pb-0">
          <div class="flex items-baseline gap-4">
            <h3 class="flex-1 text-[15px] font-semibold text-ink">${e.institution}</h3>
            <span class="shrink-0 font-mono text-[11px] text-muted">${e.dates}</span>
            ${PEN}
          </div>
          <p class="mt-1.5 text-[13.5px] text-body">${e.degree} · ${e.meta}</p>
        </article>`).join('')}
    </div>
    ${add('Adicionar formação')}
  </section>`;
</script>

<script>
/* ═══════════════════════════════════════════════════════════════════════
   SCORE DO CURRÍCULO
   Duas notas de topo; Qualidade se abre em Conteúdo + Completude. O
   Profile score é a média das duas de topo.

   Cor: a rampa do scores-demo (= landingScoreRamp) — 85 verde, 70 âmbar,
   50 laranja, abaixo vermelho.
   Nota: `scoreGrade` de packages/ui/src/internal/score-scale.ts —
   90 S · 80 A · 70 B · 60 C · 50 D · F.
   As duas escalas NÃO batem entre 80 e 85: por isso 82 sai "A" em âmbar.
   ═══════════════════════════════════════════════════════════════════ */
const RAMP  = { green:'#1FB27A', amber:'#D9A400', orange:'#F0743A', red:'#E5484D' };
const WASH  = { green:'#E3F6EE', amber:'#FBF3D4', orange:'#FDEEE5', red:'#FDECEC' };
const bandOf = v => v >= 85 ? 'green' : v >= 70 ? 'amber' : v >= 50 ? 'orange' : 'red';
const tint = v => RAMP[bandOf(v)];
const wash = v => WASH[bandOf(v)];
const grade = v => v >= 90 ? 'S' : v >= 80 ? 'A' : v >= 70 ? 'B' : v >= 60 ? 'C' : v >= 50 ? 'D' : 'F';

const TOP = [
  { name: 'Estilo & leitura pelo robô', v: 82,
    what: 'Se um software consegue ler seu currículo: layout, colunas, fontes.',
    why:  'Duas colunas e uma tabela de skills confundem o leitor automático.',
    fix:  'Aplicar o Template B (coluna única).', gain: 13 },
  { name: 'Qualidade do currículo', v: 74,
    what: 'Quão bom ele é, independente de vaga.',
    why:  'Completo, mas com experiências sem resultado.',
    fix:  null, gain: null,
    sub: [
      { name: 'Conteúdo',   v: 68, fix: 'Um resultado por experiência.', gain: 12 },
      { name: 'Completude', v: 83, fix: 'Preencher os dois campos.',     gain: 9  },
    ] },
];
const OVERALL = Math.round(TOP.reduce((a, s) => a + s.v, 0) / TOP.length);

const chip = v => `<span class="rounded-md px-[7px] py-[3px] font-mono text-[11px] font-semibold" style="background:${wash(v)};color:${tint(v)}">${grade(v)}</span>`;

/* barra de 20 segmentos — a mesma do ScoreCard da landing */
const segs = v => `<div class="flex gap-[3px]">${
  Array.from({ length: 20 }, (_, i) =>
    `<div class="h-[9px] flex-1 rounded-[2px]" style="background:${i < Math.round(v / 5) ? tint(v) : '#E4E4E7'}"></div>`).join('')
}</div>`;

const title = `<div class="mb-10 flex"><h2 class="font-sans text-[22px] font-semibold leading-none tracking-[-.4px] text-ink">Profile score</h2></div>`;
</script>

<script>
const rowV3 = (s, sub) => `
  <div class="${sub ? 'pl-6' : ''} border-t border-hair py-5">
    <div class="flex items-baseline justify-between gap-5">
      <p class="smallcaps ${sub ? 'text-muted' : 'text-ink'}">${s.name}</p>
      <div class="flex shrink-0 items-baseline gap-2.5">
        ${chip(s.v)}
        <span class="font-serif ${sub ? 'text-[24px]' : 'text-[30px]'} leading-none" style="color:${tint(s.v)}">${s.v}</span>
        <span class="font-mono text-[11px] text-subtle">/100</span>
      </div>
    </div>
    <div class="mt-3 h-[6px] overflow-hidden rounded-full bg-hair">
      <div class="h-full rounded-full" style="width:${s.v}%;background:${tint(s.v)}"></div>
    </div>
    <p class="mt-2.5 text-[12.5px] leading-[18px] text-muted">
      ${s.why ? `${s.why} ` : ''}${s.fix ? `<span class="text-body">${s.fix}</span> <b class="font-mono" style="color:${tint(s.v)}">+${s.gain}</b>` : ''}
    </p>
  </div>`;

document.getElementById('scoreBlock').innerHTML = title + `
  <div class="flex items-end justify-between gap-6 pb-7">
    <div>
      <p class="font-serif text-[76px] leading-[0.82] tracking-[-2px]" style="color:${tint(OVERALL)}">${OVERALL}</p>
      <p class="smallcaps mt-3 text-subtle">média de estilo e qualidade</p>
    </div>
    <div class="flex h-[68px] w-[68px] shrink-0 items-center justify-center rounded-2xl"
         style="background:${wash(OVERALL)}">
      <span class="font-serif text-[34px] leading-none" style="color:${tint(OVERALL)}">${grade(OVERALL)}</span>
    </div>
  </div>
  ${TOP.map(s => rowV3(s) + (s.sub ? s.sub.map(x => rowV3(x, true)).join('') : '')).join('')}`;
</script>
</body>
</html>
