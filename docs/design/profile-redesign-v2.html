<script>
/* ═══════════════════════════════════════════════════════════════════════
   SCORE — rampa e card da landing
   (landingScoreRamp + landingScoreBand em packages/tokens/src/landing.ts,
    layout em features/landing/components/score-grid.tsx)
   ═══════════════════════════════════════════════════════════════════ */
const RAMP = {
  excellent: '#1FB27A',
  good:      '#D9A400',
  fair:      '#F0743A',
  poor:      '#E5484D',
};
const band = v => (v >= 85 ? RAMP.excellent : v >= 70 ? RAMP.good : v >= 50 ? RAMP.fair : RAMP.poor);

const SEGMENTS = 20;
const bar = value => {
  const on = Math.round(value / (100 / SEGMENTS));
  const ink = band(value);
  return `<div class="flex gap-[3px]">${
    Array.from({ length: SEGMENTS }, (_, at) =>
      `<div class="h-2 flex-1 rounded-[2px]" style="background:${at < on ? ink : '#E4E4E7'}"></div>`
    ).join('')
  }</div>`;
};

const SCORE = {
  value: 72,
  what: 'O quanto seu perfil está pronto pra leitura do robô.',
  sub: [
    { value: 74,  name: 'Conteúdo (IA)', fix: 'Bullets sem número não contam.', gain: 9 },
    { value: 58,  name: 'Completude',    fix: 'Resumo profissional em branco.', gain: 18 },
    { value: 100, name: 'Estilo',        fix: 'Nada a fazer aqui.',             gain: 0 },
  ],
};

document.getElementById('scoreCard').innerHTML = `
  <div class="flex items-start justify-between gap-3">
    <div class="flex-1">
      <p class="text-[15px] font-semibold text-ink">Profile score</p>
      <p class="mt-[2px] text-[12px] leading-[17px] text-muted">${SCORE.what}</p>
    </div>
    <span class="font-serif text-[34px] leading-none" style="color:${band(SCORE.value)}">${SCORE.value}</span>
  </div>

  <div class="mt-[9px]">${bar(SCORE.value)}</div>

  <div class="mt-1">
    ${SCORE.sub.map(s => `
      <div class="flex items-start gap-[10px] border-t border-hair py-2">
        <span class="w-[26px] font-mono text-[12px]" style="color:${band(s.value)}">${s.value}</span>
        <span class="w-[110px] text-[12.5px] font-medium text-ink">${s.name}</span>
        <span class="flex-1 text-[11.5px] leading-4 text-muted">${s.fix}${
          s.gain ? `<span class="font-mono" style="color:${band(s.value)}"> +${s.gain}</span>` : ''
        }</span>
      </div>`).join('')}
  </div>`;


/* ═══════════════════════════════════════════════════════════════════════
   DADOS — perfil real da Maria (GET /v1/users/profile + /v1/resumes/:id/sections)
   ═══════════════════════════════════════════════════════════════════ */
const IDENTITY = [
  { label: 'Nome',        value: 'Maria Oliveira de Souza' },
  { label: 'Título',      value: 'Engenheira de Software Plena' },
  { label: 'Localização', value: 'São Paulo, Brazil' },
  { label: 'Resumo',      value: null },
  { label: 'Telefone',    value: null },
];

const EXPERIENCE = [
  { role: 'Engenheira de Software Plena', company: 'Patch Tech',       dates: 'Mar 2022 — Jun 2024',
    description: 'Liderei a migração do app para Expo + React Native Web.',
    achievements: ['Reduzi o tempo de build em 40%', 'Migrei 30 telas para a nova stack'] },
  { role: 'Desenvolvedora Júnior',        company: 'Loja Online BR',   dates: 'Jan 2020 — Fev 2022',
    description: 'Desenvolvi o checkout e a integração de pagamentos.',
    achievements: ['Integrei 3 gateways de pagamento'] },
  { role: 'Estagiária de Desenvolvimento', company: 'Startup Educação', dates: 'Jun 2019 — Dez 2019',
    description: 'Apoiei o time de frontend em features de gamificação.',
    achievements: ['Implementei o sistema de pontos'] },
];

const EDUCATION = [
  { institution: 'Universidade de São Paulo', degree: 'Bacharelado em Ciência da Computação', meta: 'Concluído', dates: 'Fev 2016 — Dez 2019' },
  { institution: 'FIAP',                      degree: 'Mestrado em Engenharia de Software',   meta: 'Concluído', dates: 'Fev 2020 — Jun 2021' },
];

const PEN = `<svg class="pen" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg>`;

/* Cabeçalho: serifa, contagem em mono, régua até a margem, ação fantasma. */
const head = (title, count) => `
  <div class="mb-5 flex items-baseline gap-3">
    <h2 class="font-serif text-[24px] leading-none tracking-[-.3px] text-ink">${title}</h2>
    <span class="font-mono text-[11.5px] text-subtle">${String(count).padStart(2, '0')}</span>
    <span class="h-px flex-1 bg-hair"></span>
    <button class="shrink-0 text-[12.5px] font-medium text-muted transition hover:text-ink">+ Adicionar</button>
  </div>`;

document.getElementById('sections').innerHTML = `
  <section>
    ${head('Identidade', IDENTITY.filter(f => f.value).length)}
    <dl>
      ${IDENTITY.map(f => `
        <div class="row flex cursor-pointer items-baseline gap-5 border-b border-hair py-[11px] last:border-b-0">
          <dt class="w-[104px] shrink-0 text-[12.5px] text-muted">${f.label}</dt>
          <dd class="flex-1 text-[14.5px] ${f.value ? 'text-ink' : 'italic text-subtle'}">${f.value ?? 'Adicionar'}</dd>
          ${PEN}
        </div>`).join('')}
    </dl>
  </section>

  <section>
    ${head('Experiência Profissional', EXPERIENCE.length)}
    <div>
      ${EXPERIENCE.map(e => `
        <article class="row cursor-pointer border-b border-hair py-5 first:pt-0 last:border-b-0 last:pb-0">
          <div class="flex items-baseline gap-4">
            <h3 class="flex-1 text-[15px] font-semibold text-ink">${e.role}</h3>
            <span class="shrink-0 font-mono text-[11px] text-muted">${e.dates}</span>
            ${PEN}
          </div>
          <p class="mt-[3px] text-[13.5px] text-body">${e.company}</p>
          <p class="mt-2.5 text-[13.5px] leading-[20px] text-body">${e.description}</p>
          <ul class="mt-2 space-y-[3px]">
            ${e.achievements.map(a => `
              <li class="flex gap-2 text-[13px] leading-[19px] text-muted">
                <span class="text-subtle">—</span><span>${a}</span>
              </li>`).join('')}
          </ul>
        </article>`).join('')}
    </div>
  </section>

  <section>
    ${head('Formação Acadêmica', EDUCATION.length)}
    <div>
      ${EDUCATION.map(e => `
        <article class="row cursor-pointer border-b border-hair py-5 first:pt-0 last:border-b-0 last:pb-0">
          <div class="flex items-baseline gap-4">
            <h3 class="flex-1 text-[15px] font-semibold text-ink">${e.institution}</h3>
            <span class="shrink-0 font-mono text-[11px] text-muted">${e.dates}</span>
            ${PEN}
          </div>
          <p class="mt-[3px] text-[13.5px] text-body">${e.degree} · ${e.meta}</p>
        </article>`).join('')}
    </div>
  </section>`;
</script>
</body>
</html>
