<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Login e cadastro — claro e escuro</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = { theme: { extend: { fontFamily: {
    mono: ['"JetBrains Mono"', "ui-monospace", "monospace"],
    sans: ["system-ui", "-apple-system", "Segoe UI", "Roboto", "sans-serif"],
  } } } };
</script>
<style>
  /* Espelho de packages/tokens/src/editorial.ts — os valores implementados.
     Sem inversão: o card usa `panel`, sempre um degrau acima do `bg`. */
  .app-light {
    --page-bg: #F2F1EC; --panel: #FDFDFC;
    --ink: #0A0A0A; --body: #3F3F46; --muted: #71717A; --subtle: #A1A1AA;
    --hairline: #E4E4E7; --hairline-strong: #D4D4D8; --accent: #2563EB;
    --primary: #0F172A; --on-primary: #FFFFFF;
  }
  .app-dark {
    --page-bg: #1A1916; --panel: #232220;
    --ink: #F5F5F0; --body: #C8C8C2; --muted: #8A8A84; --subtle: #5F5F5A;
    --hairline: #2E2D28; --hairline-strong: #3A3933; --accent: #60A5FA;
    --primary: #F5F5F0; --on-primary: #1A1916;
  }
  body { background: #8E8E88; }
  .frame {
    width: 390px; height: 780px;
    border-radius: 30px; overflow: hidden;
    background: var(--page-bg);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 20px 50px rgba(0,0,0,.24);
  }
  .card {
    width: 90%; border-radius: 30px;
    background: var(--panel);
    padding: 34px 26px;
  }
  .ink { color: var(--ink); } .muted { color: var(--muted); } .subtle { color: var(--subtle); }
</style>
</head>
<body class="font-sans antialiased">

<svg width="0" height="0" class="hidden" aria-hidden="true">
  <symbol id="g-github" viewBox="0 0 24 24"><path fill="currentColor" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/></symbol>
  <symbol id="g-linkedin" viewBox="0 0 24 24"><path fill="currentColor" d="M4.98 3.5C4.98 4.88 3.87 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.02 8h4.96v16H.02V8zm7.52 0h4.75v2.2h.07c.66-1.25 2.27-2.57 4.67-2.57 5 0 5.92 3.29 5.92 7.57V24h-4.96v-7.6c0-1.81-.03-4.14-2.52-4.14-2.52 0-2.91 1.97-2.91 4v7.74H7.54V8z"/></symbol>
  <symbol id="g-google" viewBox="0 0 48 48">
    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
  </symbol>
  <symbol id="g-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></symbol>
  <symbol id="g-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
</svg>

<template id="screen">
  <div class="card">
    <h1 class="text-center text-[28px] font-semibold leading-[34px] tracking-[-.4px] ink">Entrar</h1>

    <!-- chips 44pt: cores fixas da marca, idênticas nos dois temas -->
    <div class="mt-[22px] mb-[30px] flex justify-center gap-3">
      <div class="flex h-11 w-11 items-center justify-center rounded-full border"
           style="background: #FFFFFF; border-color: #D4D4D8">
        <svg class="h-5 w-5"><use href="#g-google"/></svg>
      </div>
      <div class="flex h-11 w-11 items-center justify-center rounded-full border"
           style="background: #0A66C2; border-color: #0A66C2; color: #FFFFFF">
        <svg class="h-5 w-5"><use href="#g-linkedin"/></svg>
      </div>
      <div class="flex h-11 w-11 items-center justify-center rounded-full border"
           style="background: #24292F; border-color: #3A3F45; color: #FFFFFF">
        <svg class="h-5 w-5"><use href="#g-github"/></svg>
      </div>
    </div>

    <div class="mb-0.5 flex justify-end">
      <span class="px-1.5 py-1 font-mono text-[10px] tracking-[.14em] subtle">test</span>
    </div>

    <div class="space-y-6">
      <div>
        <div class="text-[11px] font-medium uppercase tracking-[.14em] muted">E-mail</div>
        <div class="mt-2 border-b pb-2.5" style="border-color: var(--hairline-strong)">
          <span class="text-[16px] subtle">voce@exemplo.com</span>
        </div>
      </div>
      <div>
        <div class="text-[11px] font-medium uppercase tracking-[.14em] muted">Senha</div>
        <div class="mt-2 flex items-center gap-3 border-b pb-2.5" style="border-color: var(--hairline-strong)">
          <span class="flex-1 text-[16px] subtle">Sua senha</span>
          <svg class="h-[18px] w-[18px] muted"><use href="#g-eye"/></svg>
        </div>
      </div>
    </div>

    <div class="mt-[26px]">
      <div class="flex min-h-[54px] items-center justify-center gap-3 rounded-full px-6" style="background: var(--primary)">
        <span class="text-[15px] font-semibold" style="color: var(--on-primary)">Entrar</span>
        <svg class="h-[18px] w-[18px]" style="color: var(--on-primary)"><use href="#g-arrow"/></svg>
      </div>
    </div>

    <div class="mt-3.5 text-center">
      <span class="py-1.5 text-[13px] font-medium" style="color: var(--accent)">Esqueci minha senha</span>
    </div>

    <div class="mt-9 text-center text-[13px]">
      <span class="muted">Não tem conta? </span>
      <span class="font-semibold ink">Criar conta →</span>
    </div>
  </div>
</template>
<template id="screen-signup">
  <div class="card">
    <h1 class="text-center text-[28px] font-semibold leading-[34px] tracking-[-.4px] ink">Criar conta</h1>

    <!-- chips 44pt: cores fixas da marca, idênticas nos dois temas -->
    <div class="mt-[22px] mb-[30px] flex justify-center gap-3">
      <div class="flex h-11 w-11 items-center justify-center rounded-full border"
           style="background: #FFFFFF; border-color: #D4D4D8">
        <svg class="h-5 w-5"><use href="#g-google"/></svg>
      </div>
      <div class="flex h-11 w-11 items-center justify-center rounded-full border"
           style="background: #0A66C2; border-color: #0A66C2; color: #FFFFFF">
        <svg class="h-5 w-5"><use href="#g-linkedin"/></svg>
      </div>
      <div class="flex h-11 w-11 items-center justify-center rounded-full border"
           style="background: #24292F; border-color: #3A3F45; color: #FFFFFF">
        <svg class="h-5 w-5"><use href="#g-github"/></svg>
      </div>
    </div>

    <div class="mb-0.5 flex justify-end">
      <span class="px-1.5 py-1 font-mono text-[10px] tracking-[.14em] subtle">test</span>
    </div>

    <div class="space-y-6">
      <div>
        <div class="text-[11px] font-medium uppercase tracking-[.14em] muted">E-mail</div>
        <div class="mt-2 border-b pb-2.5" style="border-color: var(--hairline-strong)">
          <span class="text-[16px] subtle">voce@exemplo.com</span>
        </div>
      </div>
</div>
    <div class="mt-6">
      <div class="text-[11px] font-medium uppercase tracking-[.14em] muted">Senha</div>
      <div class="mt-2 flex items-center gap-3 border-b pb-2.5" style="border-color: var(--hairline-strong)">
        <span class="flex-1 text-[16px] subtle">Sua senha</span>
        <svg class="h-[18px] w-[18px] muted"><use href="#g-eye"/></svg>
      </div>
      <div class="mt-3 flex gap-1.5">
        <div class="h-1 flex-1 rounded-full" style="background: #16A34A"></div>
        <div class="h-1 flex-1 rounded-full" style="background: #16A34A"></div>
        <div class="h-1 flex-1 rounded-full" style="background: var(--hairline)"></div>
        <div class="h-1 flex-1 rounded-full" style="background: var(--hairline)"></div>
      </div>
    </div>

    <div class="mt-6 flex items-start gap-3">
      <div class="mt-0.5 h-[18px] w-[18px] flex-none rounded-[3px] border-[1.5px]" style="border-color: var(--hairline-strong)"></div>
      <p class="text-[13px] leading-5" style="color: var(--body)">
        Li e aceito os <span style="color: var(--accent); text-decoration: underline">Termos de Uso</span>
        e a <span style="color: var(--accent); text-decoration: underline">Política de Privacidade</span>.
      </p>
    </div>


    <div class="mt-[26px]">
      <div class="flex min-h-[54px] items-center justify-center gap-3 rounded-full px-6" style="background: var(--primary)">
        <span class="text-[15px] font-semibold" style="color: var(--on-primary)">Criar conta</span>
        <svg class="h-[18px] w-[18px]" style="color: var(--on-primary)"><use href="#g-arrow"/></svg>
      </div>
    </div>


    <div class="mt-9 text-center text-[13px]">
      <span class="muted">Já tem conta? </span>
      <span class="font-semibold ink">Fazer login →</span>
    </div>
  </div>
</template>

<main class="mx-auto max-w-[1800px] px-8 py-14">
  <div class="flex flex-wrap justify-center gap-12">
    <div>
      <div class="frame app-light" data-screen></div>
      <p class="mt-4 text-center font-mono text-[11px] uppercase tracking-[.16em] text-white/85">login · claro</p>
    </div>
    <div>
      <div class="frame app-light" data-screen-signup></div>
      <p class="mt-4 text-center font-mono text-[11px] uppercase tracking-[.16em] text-white/85">cadastro · claro</p>
    </div>
    <div>
      <div class="frame app-dark" data-screen></div>
      <p class="mt-4 text-center font-mono text-[11px] uppercase tracking-[.16em] text-white/85">login · escuro</p>
    </div>
    <div>
      <div class="frame app-dark" data-screen-signup></div>
      <p class="mt-4 text-center font-mono text-[11px] uppercase tracking-[.16em] text-white/85">cadastro · escuro</p>
    </div>
  </div>
</main>

<script>
  const tpl = document.getElementById("screen");
  for (const host of document.querySelectorAll("[data-screen]")) {
    host.appendChild(tpl.content.cloneNode(true));
  }
  const tplSignup = document.getElementById("screen-signup");
  for (const host of document.querySelectorAll("[data-screen-signup]")) {
    host.appendChild(tplSignup.content.cloneNode(true));
  }
</script>
</body>
</html>
