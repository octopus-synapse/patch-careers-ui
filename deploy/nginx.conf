# Serves the Expo web static export (apps/client/dist). Port 7142 is
# what the Caddy vhost for patchcareers.org proxies to on the VPS —
# keep it in sync with deploy/docker-compose.yml and the Caddyfile.
server {
    listen 7142;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # Hashed Metro bundles — safe to cache forever.
    location /_expo/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Expo assets carry content hashes in the filename too, but the
    # guarantee is weaker than Metro's — cache for a day.
    location /assets/ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # SPA fallback: expo-router owns every path client-side. index.html
    # must never be cached so a deploy is picked up on next load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
