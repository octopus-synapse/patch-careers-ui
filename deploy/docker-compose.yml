# Production compose for the web frontend. The fast-deploy workflow
# syncs this file to /opt/patch-careers-ui/docker-compose.yml on the VPS
# and writes IMAGE_TAG into the .env next to it. Caddy on the host
# terminates TLS for patchcareers.org and proxies to localhost:7142.
services:
  web:
    # No `:latest` fallback on purpose: the deploy publishes only immutable
    # `main-<sha>` tags, so an unset IMAGE_TAG means "I don't know what to
    # run" — fail loudly instead of resurrecting whatever `latest` points at.
    image: ghcr.io/octopus-synapse/patch-careers-ui:${IMAGE_TAG:?IMAGE_TAG is required (set it in .env)}
    container_name: patchcareers-web
    restart: unless-stopped
    ports:
      - "7142:7142"
    healthcheck:
      # 127.0.0.1, not localhost: alpine resolves localhost to ::1 first
      # and nginx only listens on IPv4 — wget would get refused.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:7142/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
