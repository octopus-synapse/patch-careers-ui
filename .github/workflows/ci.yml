name: CI

# V2 monorepo CI — pnpm + Nx. Replaces the V1 pipeline which fanned out
# via Turbo + octopus-synapse shared actions and built a SvelteKit
# Docker image. Mobile (EAS Build) and OTA workflows land in PR #20.

on:
  pull_request:
    branches: [main, homolog, dev]
  # Deploy is gated on this workflow's verdict (deploy.yml listens for a
  # successful `workflow_run` on main), so `paths-ignore` doubles as the deploy
  # filter: a docs-only push produces no CI run, so nothing deploys.
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
      - "*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read
  # @octopus-synapse/precommit vem do GitHub Packages (npm.pkg.github.com);
  # sem packages:read o GITHUB_TOKEN toma 403 no pnpm install.
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PNPM_VERSION: 9.15.4
  NODE_VERSION: 20.x
  # @octopus-synapse/precommit is served from GitHub Packages (see .npmrc)
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  setup:
    name: Setup (install deps)
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - id: cache-key
        run: echo "value=${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile

  lint:
    name: Lint (Biome)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  nx-affected:
    name: Nx affected (typecheck + test + build)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Kubb output (src/generated/{hooks,ts,zod}) is gitignored but the
      # committed src/generated/index.ts re-exports it, so a clean checkout
      # fails typecheck with TS2307 until this runs. Same step the iOS
      # workflow already carries.
      - name: Generate API SDK
        run: pnpm --filter @patch-careers/api-client sdk:generate

      # Derive the base ref for `nx affected` so PRs only run on touched
      # projects; pushes to main run the full graph via run-many.
      - name: Set Nx SHAs
        if: github.event_name == 'pull_request'
        uses: nrwl/nx-set-shas@v4

      - name: Typecheck (affected on PR, all on push)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec nx affected -t typecheck --parallel=3
          else
            pnpm exec nx run-many -t typecheck --parallel=3
          fi

      - name: Test (affected on PR, all on push)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec nx affected -t test --parallel=3
          else
            pnpm exec nx run-many -t test --parallel=3
          fi

      # Architectural boundary specs live in the client app, which Nx does not
      # run as a `test` target — gate them explicitly (feature graph + DS
      # adoption). Style/i18n migration specs stay out until green (ADR-0007).
      - name: Architecture specs
        run: pnpm verify:arch

      # `export` (expo export), not `build`. The @nx/expo-inferred `build`
      # target shells out to `eas build` — a cloud build needing eas-cli and an
      # Expo account, so it can only ever fail here ("eas: not found"). No
      # library package defines a build target at all, so `-t build` resolved
      # to that one broken task and nothing else. `expo export` is the real
      # question CI should ask: does the app still bundle? It emits the web,
      # Android and iOS bundles locally, no account required.
      - name: Bundle (affected on PR, all on push)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pnpm exec nx affected -t export --parallel=3
          else
            pnpm exec nx run-many -t export --parallel=3
          fi
